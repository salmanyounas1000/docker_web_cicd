name: CI/CD Pipeline

on:
  push:
    branches: [ "newbranch" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code
    - uses: actions/checkout@v3

    # 2. Log in to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build and Push Docker Image
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/devops-project:latest

    # 4. Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          # Stop the old container
          docker stop devops-app || true
          docker rm devops-app || true
          
          # Pull the new image
          docker pull ${{ secrets.DOCKER_USERNAME }}/devops-project:latest
          
          # Run the new container
          docker run -d --name devops-app -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/devops-project:latest
